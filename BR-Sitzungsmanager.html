<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BR-Sitzungsmanager – Tagesordnungen &amp; Protokolle</title>
<style>
/* Fallback-CSS, muss mit br-design.css synchron gehalten werden. */
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.5;color:#0D1113;background:#F4F5F3}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.seitenleiste{background:#151A18;color:#E4E8E5;display:flex;flex-direction:column;padding-bottom:8px}
.seitenleiste h1{font-family:"Bahnschrift",system-ui,sans-serif;font-size:22px;color:#fff;text-transform:uppercase}
.marke,.sl-aktion,.sl-filter,.sl-fuss{padding:12px 14px}
.marke-kennfeld{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.13);padding:3px 8px;margin-top:8px}
.sl-liste{flex:1;overflow-y:auto;padding:4px 14px}
.sl-nav{display:flex;flex-direction:column;padding:4px 10px}
.sl-nav-btn{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:none;color:#E4E8E5;padding:8px 11px;cursor:pointer;font-weight:600}
.haupt-innen{max-width:1100px;margin:0 auto;padding:24px 32px;width:100%}
.karte{background:#fff;border:1px solid #D5D9D6;border-top:2px solid #0D1113;margin-bottom:20px}
.karte-kopf{padding:12px 18px;border-bottom:1px solid #D5D9D6}
.karte-kopf h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.karte-koerper{padding:16px 18px}
.karte-fuss{padding:10px 18px;border-top:1px solid #D5D9D6;font-size:12.5px;color:#5F6B72;background:#F4F5F3}
.btn{border:1px solid #AEB5B1;background:#fff;padding:7px 13px;cursor:pointer;font-weight:600;letter-spacing:.05em}
.btn-primaer{background:#009057;border-color:#009057;color:#fff}
.feld{display:flex;flex-direction:column;gap:5px}
.feld>label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.feld input,.feld select,.feld textarea,input.eingabe,select.eingabe,textarea.eingabe{border:1px solid #AEB5B1;padding:7px 10px;width:100%}
.raster{display:grid;gap:14px}
.tabs{display:flex;gap:0;border-bottom:2px solid #0D1113;margin:16px 0 20px}
.tabs button{background:none;border:none;padding:10px 16px;cursor:pointer;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5F6B72}
.tabs button.aktiv{color:#0D1113;background:#fff;border-bottom:3px solid #009057}
.sperrschirm{position:fixed;inset:0;z-index:1000;background:#0E1211;display:flex;align-items:center;justify-content:center;padding:24px}
.sperr-karte{background:#fff;border:2px solid #0D1113;width:min(460px,100%);padding:28px}
.sperr-karte h2{font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.sperr-karte .ueberzeile{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #AEB5B1;padding:2px 8px;margin:10px 0}
.sperr-karte label{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin:14px 0 4px}
.sperr-karte input{width:100%;padding:10px 12px;border:1px solid #AEB5B1}
.sperr-fehler{color:#A32017;font-size:12.5px;margin-top:10px;min-height:16px}
.pw-wrap{position:relative}.pw-wrap input{padding-right:42px}
.pw-auge{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:none;width:32px;height:32px;cursor:pointer;color:#5F6B72}
dialog{border:2px solid #0D1113;padding:0;max-width:880px;width:min(92vw,880px);max-height:88vh;overflow:auto}
dialog .dlg-kopf{padding:14px 22px;border-bottom:2px solid #0D1113;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
dialog .dlg-koerper{padding:18px 22px}
dialog .dlg-fuss{padding:13px 22px;border-top:1px solid #D5D9D6;display:flex;justify-content:flex-end;gap:9px}
#toastContainer{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:9px}
.toast{background:#0D1113;color:#fff;padding:11px 16px;max-width:390px;border-top:2px solid #35C68C}
.toast.fehler{background:#A32017}
.toast.erfolg{background:#00673E}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.klein-grau{font-size:12px;color:#5F6B72}
.rolle-viewer #kDuplizieren,.rolle-viewer #kArchiv,.rolle-viewer #kLoeschen,.rolle-viewer #toNeu,.rolle-viewer #toStandard,.rolle-viewer #gastNeu,.rolle-viewer #gastAusStamm,.rolle-viewer #dokUpload,.rolle-viewer #lzNeu,.rolle-viewer #hauptInhalt [data-tu="neu"],.rolle-viewer #hauptInhalt [data-tu="weg"],.rolle-viewer #hauptInhalt [data-tu="hoch"],.rolle-viewer #hauptInhalt [data-tu="runter"],.rolle-viewer #hauptInhalt [data-tu="beschlussNeu"],.rolle-viewer #hauptInhalt [data-tu="baustein"]{display:none !important}
</style>
<link rel="stylesheet" href="br-design.css">
</head>
<body>
<a class="sprungmarke" href="#hauptInhalt">Zur Arbeitsfläche springen</a>
<div class="app" id="app">
  <aside class="seitenleiste">
    <div class="marke">
      <h1>BR-Sitzungsmanager</h1>
      <div class="marke-kennfeld" id="markeKennfeld">Betriebsrat</div>
      <div class="untertitel">Tagesordnungen &amp; Protokolle · lokal &amp; offline</div>
    </div>
    <nav class="sl-nav" aria-label="Übersichten">
      <button class="sl-nav-btn" id="btnBeschluesse" title="Alle Beschlüsse aller Sitzungen"><svg class="ic"><use href="#ic-beschluss"/></svg><span>Beschlüsse</span></button>
      <button class="sl-nav-btn" id="btnAufgaben" title="Alle Aufgaben aus allen Protokollen"><svg class="ic"><use href="#ic-aufgabe"/></svg><span>Aufgaben</span></button>
      <button class="sl-nav-btn" id="btnDokumente" title="Dokumente, Protokolle und Anlagen"><svg class="ic"><use href="#ic-doc"/></svg><span>Dokumente</span></button>
      <button class="sl-nav-btn" id="btnUrlaub" title="Urlaubskalender des Gremiums"><svg class="ic"><use href="#ic-kalender"/></svg><span>Urlaub</span></button>
      <button class="sl-nav-btn" id="btnStammdaten" title="Stammdaten, Personen und Debug-Panel"><svg class="ic"><use href="#ic-people"/></svg><span>Gremium &amp; Mitglieder</span></button>
    </nav>
    <div class="sl-stand" id="sitzungsstand"></div>
    <div class="sl-sektion">Sitzungen</div>
    <div class="sl-aktion"><button class="btn btn-dunkel" id="btnNeueSitzung">+ Neue Sitzung anlegen</button></div>
    <div class="sl-filter">
      <input id="slSuche" type="search" placeholder="Suchen (Nr., Datum, Status) …" autocomplete="off">
      <label class="sl-archiv-toggle"><input type="checkbox" id="slArchiv"> Archiv anzeigen <span id="slArchivZahl"></span></label>
    </div>
    <div class="sl-liste" id="sitzungListe"></div>
    <div class="sl-fuss">
      <div class="rolle-reihe">
        <span class="rolle-anzeige"><span class="rolle-punkt"></span><span id="rolleAnzeige">—</span></span>
        <button class="btn btn-dunkel btn-klein" id="btnSperren" title="App sperren / abmelden">Ausloggen</button>
      </div>
      <div class="reihe">
        <button class="btn btn-dunkel" id="btnProjektSpeichern" title="Alle Daten als Datei sichern (Strg+S)"><svg class="ic"><use href="#ic-save"/></svg>Sichern (Datei)</button>
        <button class="btn btn-dunkel" id="btnProjektOeffnen" title="Vorhandene Sicherung öffnen"><svg class="ic"><use href="#ic-open"/></svg>Öffnen</button>
      </div>
      <div class="reihe uebergabe">
        <button class="btn btn-dunkel" id="btnSitzungExport" title="Nur die gewählte Sitzung als verschlüsselte Übergabedatei ausgeben">Sitzung übergeben</button>
        <button class="btn btn-dunkel" id="btnSitzungImport" title="Eine übergebene Sitzung in diesen Speicherstand übernehmen">Sitzung übernehmen</button>
      </div>
      <div class="autosave" id="autosaveInfo"></div>
      <div class="autosave" id="sicherungInfo"></div>
      <div class="sl-copyright">© 2026 Patrick Pählke – Alle Rechte vorbehalten.</div>
    </div>
  </aside>
  <main class="haupt"><div class="haupt-innen" id="hauptInhalt" tabindex="-1"></div></main>
</div>

<!-- Icon-Sprite (Inline-SVG, keine weitere Datei nötig) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="ic-beschluss" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
  <symbol id="ic-aufgabe" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
  <symbol id="ic-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
  <symbol id="ic-people" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="ic-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol>
  <symbol id="ic-open" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="ic-kalender" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></symbol>
  <symbol id="ic-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="ic-auge" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="ic-weg" viewBox="0 0 24 24"><path d="M5 5l14 14"/><path d="M19 5L5 19"/></symbol>
  <symbol id="ic-links" viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></symbol>
  <symbol id="ic-rechts" viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></symbol>
  <symbol id="ic-hoch" viewBox="0 0 24 24"><polyline points="5 15 12 8 19 15"/></symbol>
  <symbol id="ic-runter" viewBox="0 0 24 24"><polyline points="5 9 12 16 19 9"/></symbol>
  <symbol id="ic-liste" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><rect x="3" y="5" width="2.5" height="2.5"/><rect x="3" y="11" width="2.5" height="2.5"/><rect x="3" y="17" width="2.5" height="2.5"/></symbol>
</svg>

<dialog id="dlgStammdaten"></dialog>
<dialog id="dlgBestaetigen" class="klein"></dialog>
<dialog id="dlgVorlagen" class="klein"></dialog>
<div id="toastContainer" role="status" aria-live="polite"></div>

<input type="file" id="dateiProjekt" accept=".json,application/json" hidden>
<input type="file" id="dateiBeitritt" accept=".json,application/json" hidden>
<input type="file" id="dateiSitzung" accept=".json,application/json" hidden>
<input type="file" id="dateiDokument" multiple hidden>
<input type="file" id="dateiStandardTops" accept=".js,.json,application/json,text/javascript" hidden>
<input type="file" id="dateiKategorien" accept=".js,.json,application/json,text/javascript" hidden>
<input type="file" id="dateiVorlagen" accept=".js,.json,application/json,text/javascript" hidden>
<input type="file" id="dateiAnlagen" multiple hidden>
<input type="file" id="dateiLogo" accept="image/png,image/jpeg" hidden>
<input type="file" id="dateiBeschlussVorlagen" accept=".js,.json,application/json,text/javascript" hidden>
<input type="file" id="dateiUrlaub" accept=".js,.json,application/json,text/javascript" hidden>
<input type="file" id="dateiUrlaubMeldung" accept=".json,application/json" multiple hidden>

<!-- Betriebsart: "sitzung" oder "protokoll" - beide Dateien teilen sich denselben Code. -->
<script>window.BR_MODUS = 'sitzung';</script>

<!-- Fehlt pdf-lib.min.js, laeuft die App weiter, nur ohne PDF-Erzeugung. -->
<script src="scripts/pdf-lib.min.js"></script>
<script src="scripts/standard-tops.js"></script>
<script src="scripts/category.js"></script>
<script src="scripts/protokoll_vorlagen.js"></script>
<script src="scripts/beschluss_vorlagen.js"></script>
<!-- urlaub.js ist reine Lesequelle, wird nicht mitgesichert. -->
<script src="scripts/urlaub.js"></script>
<!-- br-zugang.js ist massgeblich fuer den Zugang; fehlt sie, bleibt die App gesperrt. -->
<script src="scripts/br-zugang.js"></script>
<!-- Gremium wird im Sitzungsmanager gepflegt, das Protokollmodul uebernimmt es beim Oeffnen. -->
<script src="scripts/Gremium"></script>

<!-- Reihenfolge bindend: br-kern.js zuerst, br-export.js zuletzt (startet die App). -->
<script src="scripts/br-kern.js"></script>
<script src="scripts/br-app.js"></script>
<script src="scripts/br-tagesordnung.js"></script>
<script src="scripts/br-protokoll.js"></script>
<script src="scripts/br-export.js"></script>
</body>
</html>
